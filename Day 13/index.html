    <!-- 
    Position properties in CSS
      1. Relative
        it makes the element independent from the document 
        and allows to move the element using left, right, top, bottom properties
        creates the positioning context for the absolute positioned element

      2. absolute
        it makes the element independent from the document flow 
        and also erase its space from the document

      3. sticky

        element scrolls upto the given value after that it becomes fixed


      4. fixed
        element remains fixed on the screen

    grid properties
      grid is two dimensional layout system in CSS


      display : grid;

    create the columns in grid
      grid-template-column : 
    -->
