<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
  </head>
  <body class="d-flex justify-content-center align-items-center flex-column">
    <!-- 
    
        Responsive web Design using Media Queries
            When the webpage is displayed on the diffrent screen size to maintain the visibility and 
            structure accroding to the screen size we have to make these pages responsive using the media queries

            media queries are the css function used to target the specific screen size and orientation

            when we style the webpages without using media queries then it is only visible properly on the device
            that we are builidng the application

        Transitions & animations in CSS
        
    
    -->

    <div
      class="top-bar d-flex justify-content-between align-items-center border-radius-bottom"
    >
      <div class="left d-flex justify-content-around">
        <div>
          <span>&starf;</span>
          <span>Get 5% off on your first order</span>
        </div>
        <span>Promo: ORDER5</span>
      </div>
      <div class="right d-flex justify-content-around align-items-center">
        <span>📍</span>
        <span>Banjara Hills, <b>Road No. 12</b> Hyderabad</span>
        <a href="">Change Location</a>
      </div>
    </div>
    <header class="d-flex justify-content-between align-items-center">
      <div class="first">
        <span>Order</span>
        <span>.in</span>
      </div>
      <nav class="nav-lg d-flex justify-content-between">
        <a href="" class="text-none color-black">Home</a>
        <a href="" class="text-none color-black">Browse Menu</a>
        <a href="" class="text-none color-black">Special Offers</a>
        <a href="" class="text-none color-black">Restaurants</a>
        <a href="" class="text-none color-black">Track Order</a>
      </nav>
      <div class="buttons">
        <button>
          <p><span>icon</span> <span>23</span></p>
          &#8377; 1,249
        </button>
        <button>
          <span>icon</span>
          <span>Login / Signup</span>
        </button>
      </div>
      <div class="menu" id="menu">
        <span class="material-symbols-outlined"> menu </span>
      </div>
      <div
        class="mobile-menu d-flex flex-column justify-content-center align-items-center"
        id="mobile_menu"
      >
        <nav class="mobile-nav d-flex flex-column justify-content-between">
          <a href="" class="text-none color-black">Home</a>
          <a href="" class="text-none color-black">Browse Menu</a>
          <a href="" class="text-none color-black">Special Offers</a>
          <a href="" class="text-none color-black">Restaurants</a>
          <a href="" class="text-none color-black">Track Order</a>
        </nav>
        <div class="mobile-menu-buttons d-flex flex-column">
          <button>
            <p><span>icon</span> <span>23</span></p>
            &#8377; 1,249
          </button>
          <button>
            <span>icon</span>
            <span>Login / Signup</span>
          </button>
        </div>
      </div>
    </header>

    <script>
      const menuBtn = document.getElementById("menu");
      const menuContainer = document.getElementById("mobile_menu");
      menuBtn.addEventListener("click", (e) => {
        menuContainer.classList.toggle("show");
      });
    </script>
  </body>
</html>
