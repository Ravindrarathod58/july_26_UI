<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      span {
        color: red;
      }
      /* . for the class
            # for the id
        
        */
    </style>
  </head>
  <body>
    <!-- 
            CSS
                CSS is used to style the webpages
                we can add the colors, backgrounds, fonts, images
                layouts 

            Ways to write 
            1. inline css
                using the style attribute
                style = "propertyName : value"
            2. internal CSS
                using the style tag in head section
                selector - to identify the element
                    class, id, tagname

                <style>
                        selector {
                        
                            propertyName : value;
                        }
                </style>

            3. external css
                1. create a .css file 
                2. add the file in html using link tag
                using the selector we can style the tags / elements

    
    
        priority
                1. custom priority 
                    using !important

                1. inline CSS
                2. internal CSS
                3. external CSS
    

        colors
                1. foreground
                    color property changes the color of the text
                    values 
                        1. keywords (red,green,blue)
                        2. hexadecimal #ff11ff
                        3. 3 digit hexadecimal   #f1f
                        4. values from color wheel
                            RGB
                            rgb(r, g, b, alpha)
                            rgb(255, 255, 255)
                2. background
                    background color
                    backgorund image
                        url() -> to add the images
                        linear-gradient() -> sequential color combination
                        radial-gradient() -> circular color combination
    
        -->
