      p {
        /* font-size: 3rem;
        font-weight: 900;
        letter-spacing: 5px;

        line-height: 2; */
        /* font-family: monospace; */
        font-family: "Modak", system-ui;

  <body>
    <!-- 
    
        Typography in CSS
            changing font styles, colors, sizes

        1. font-size
            incr / decr the text size

        Units
            1. px
            2. rem
                relative to root element (HTML)
                16 - 1rem = 16px
                2rem = 16 * 2 = 32px
            3. em
                relative to parent element
                1em = parent font size (30px)
                2em = 30 * 2 = 60px

            font-size : 2rem;

        2. color
            to change the color of the text

        3. font weight
            bold bolder lighter
            100 - 900

        4. text-decoration
            - underline
            - overline
            - line through
            - none

        5. letter spacing
        6. word spacing
        7. line height
        8. font family
            font faces
        9. font-style
        10. text-shadow


    Box - modal
        every HTML element iteself is box
        1. height
        2. width
        3. margin
            1. margin-left
            2. margin-right
            3. margin-top
            4. margin-bottom

        4. padding
            1. padding-left
            2. padding-right
            3. padding-top
            4. padding-bottom
        5. border

        6. border-radius

        7. box-shadow

        8. box-sizing
            - border-box
                element content
            - content-box
                element border



    -->
    <p>हा एक पॅराग्राफ आहे</p>

    <a href="">Click here</a>
    <div>

        assumenda.
      </p>
    </div>

    <div class="box box1">

    </div>
    <div class="box">

    </div>
